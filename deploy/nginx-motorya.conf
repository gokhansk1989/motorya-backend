# CANLI SUNUCUDAKI YAPILANDIRMANIN BIREBIR KOPYASI
# (/etc/nginx/sites-available/motorya, 2026-10-22'de alindi)
#
# Bu dosya repodakinden TAMAMEN farkliydi ve icinde `client_max_body_size`
# yoktu. Onemi somut: yukleme limiti yalnizca sunucuda elle yazilmisti,
# yani bir sonraki sunucu tasimasinda kaybolacak ve fotograf yuklemeleri
# sessizce 502 vermeye baslayacakti - tipki pg-backup.sh ve pm2
# yapilandirmasinin gecen tasimada geride kalmasi gibi.
#
# Sunucuda elle degisiklik yapildiginda bu dosya da guncellenmeli.
# Gecis oncesi yapilandirma.
# 443: Cloudflare origin'e HTTPS ile bagliyor (Full mod). Sertifika su an
# kendinden imzali; tarayici degil yalnizca Cloudflare goruyor. Gecis sonrasi
# Let's Encrypt veya Cloudflare Origin Certificate ile degistirilecek.
map $host $ust_akis {
    default            http://127.0.0.1:3001;   # site ve yeni.motorya
    admin.motorya.com.tr      http://127.0.0.1:3002;
    yeniadmin.motorya.com.tr  http://127.0.0.1:3002;  # gecis oncesi panel testi
    api.motorya.com.tr        http://127.0.0.1:3000;
    yeniapi.motorya.com.tr    http://127.0.0.1:3000;
}

server {
    listen 80;
    listen 443 ssl http2;

    server_name motorya.com.tr www.motorya.com.tr yeni.motorya.com.tr admin.motorya.com.tr yeniadmin.motorya.com.tr api.motorya.com.tr yeniapi.motorya.com.tr;

    ssl_certificate     /etc/nginx/ssl/cf-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cf-origin.key;

    client_max_body_size 25m;

    location /api-backend/ {
        rewrite ^/api-backend/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hatirlatio-api/ {
        rewrite ^/hatirlatio-api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $ust_akis;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

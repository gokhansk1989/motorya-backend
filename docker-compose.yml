services:
  # Arama motoru. Portu dışarı yayınlanmıyor: API aynı Docker ağından
  # http://meilisearch:7700 ile erişiyor, dışarıya açmanın bir faydası yok.
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: vites_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-dev-key}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  api:
    build: .
    container_name: vites_api
    depends_on:
      meilisearch:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MEILI_HOST: http://meilisearch:7700
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    command: node dist/main.js
    restart: unless-stopped

volumes:
  meili_data:
  uploads_data:
